<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Astronaut Musculoskeletal Health & Performance Monitoring System: fictional-data prototype. Not a medical device." />
    <meta name="theme-color" content="#F5F7FB" />
    <link rel="icon" type="image/svg+xml" href="/logo/msk-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>MSK Performance Monitor</title>
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem('msk-theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = storedTheme || (systemDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
